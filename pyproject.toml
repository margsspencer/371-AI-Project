[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gradplanner"
version = "0.1.0"
description = "Graduation Calendar Planner for WFU CS undergraduates (course project)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gradplanner = ["db/*.sql", "recommender/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# OR-Tools' protobuf dependency warns about Python 3.14; not our code.
filterwarnings = ["ignore:Type google._upb._message:DeprecationWarning"]
