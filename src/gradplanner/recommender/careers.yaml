# Career pick-list for the recommender. Written by the project team (2026-11-03).
#
# Each career adds keywords to the student's own words before matching them
# against course titles and descriptions from the Bulletin. Keywords should be
# words that actually appear in course descriptions ("learning", "network"),
# not job-ad jargon ("MLOps"). The paper discusses how these lists were chosen.

machine-learning-engineer:
  label: Machine learning engineer
  keywords: machine learning, neural networks, deep learning, data, statistics, optimization,
    regression, classification, artificial intelligence, algorithms, linear algebra, probability

data-scientist:
  label: Data scientist
  keywords: data, statistics, statistical, regression, visualization, modeling, analysis, databases,
    machine learning, probability, inference, multivariate, computing

software-engineer:
  label: Software engineer
  keywords: software, engineering, design, testing, programming, projects, team, development,
    systems, databases, web, applications

cybersecurity-analyst:
  label: Cybersecurity analyst
  keywords: security, cryptography, network, protocols, authentication, access control, privacy,
    operating systems, risk, attacks, forensics

game-developer:
  label: Game developer
  keywords: graphics, rendering, animation, games, interactive, visualization, geometry, simulation,
    physics, programming, design

systems-cloud-engineer:
  label: Systems / cloud engineer
  keywords: operating systems, distributed, parallel, network, protocols, architecture, performance,
    concurrency, cloud, systems, compilers, memory

computational-biologist:
  label: Computational biologist
  keywords: bioinformatics, biology, genomics, sequences, biological, computational, data, statistics,
    algorithms, modeling

researcher-theory:
  label: Research / graduate school (theory)
  keywords: theory, algorithms, complexity, computability, proofs, logic, automata, mathematics,
    analysis, discrete, formal, languages

