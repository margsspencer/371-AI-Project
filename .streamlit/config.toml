# Light theme: warm off-white page, white cards, dark text, gold as an accent only
# (Wake Forest colors; no logos or marks).
[theme]
base = "light"
primaryColor = "#8A6A22"              # deep gold: buttons, selected tabs, checkboxes, focus rings
backgroundColor = "#FAF8F3"           # warm off-white page
secondaryBackgroundColor = "#F1ECE0"  # light sand: inputs, tables, chips, sidebar
textColor = "#1F1F1F"                 # near-black text
font = "sans serif"

[client]
toolbarMode = "minimal"
