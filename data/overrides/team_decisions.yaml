# Rules decided by the project team (NOT found on the Bulletin pages we scrape).
# Every entry records who decided it and when, so the paper and the UI can
# show where a rule came from. Edit with care.

extra_core_categories:
  - id: QR
    family: divisional-wide
    name: Quantitative Reasoning (QR)
    tag: QR
    courses_required: 1
    source: "team review 2026-10-26: QR is a school-wide requirement; at least one QR-tagged course before graduation"
    note: "Not described on /undergraduate/requirements-degrees/ (2026-27). Confirm with an advisor."

offering_default:
  terms: [fall, spring]
  year_parity: any
  source: "team decision 2026-10-26: Bulletin gives no offering pattern for most courses; assume fall + spring every year"

prereq_mixed_and_or:
  rule: "'A and B or C' (no parentheses) means A and (B or C): every course joined by 'or' is an option"
  source: "team decision 2026-10-26"

# Used by the planner (milestone 3).
placeholder_hours:
  # Credit hours of a core "slot" the planner reserves for a course outside our
  # catalog (we only scrape CSC/MTH/STA, so FYS, WRI, HES, language, and most
  # divisionals are generic slots).
  default: 3
  BASIC-WRI: 4      # Bulletin: "4 writing credits" (WRI 111, or WRI 109 + 110)
  BASIC-HES: 1      # ASSUMPTION (team, 2026-11-03): Bulletin implies HES 100 is under 3 h but gives no number. Confirm.
  source: "team decision 2026-11-03"

subject_departments:
  # Divisional requirements list departments by name. Subject names from
  # Courses A-Z are matched against those lists automatically; these entries
  # cover names that differ. Subjects that match no division (e.g. Classics,
  # French in Translation) don't count toward a division automatically; the
  # planner uses a generic slot instead. (team, 2026-11-03)
  CSC: Computer Science
  MTH: Mathematics
  STA: Statistical Sciences
  REL: Study of Religions
  WGS: "Women’s, Gender, and Sexuality Studies"
  POL: Politics and International Affairs

subject_aliases:
  # Names programs use for a subject that differ from the Courses A-Z name.
  # Used to read rows like "Select four courses in Art History". (team, 2026-11-03)
  art history: ART
  studio art: ART
  greek: GRK
  latin: LAT
  economics: ECN
  journalism: JOU
  spanish: SPA
  physics: PHY
  biology: BIO
  chemistry: CHM
  psychology: PSY
  statistics: STA

business_school:
  # Students are admitted to the School of Business in the spring of sophomore
  # year. Business majors can't take School of Business courses before then,
  # except the "Prerequisites for Admission" listed on each business major page
  # (ACC 111, BEM 201, ...). Non-business students need instructor permission
  # (Bulletin, Advising and Registration page), so the planner doesn't pick
  # these courses for them unless one of their programs requires them.
  subjects: [ACC, BEM, BUS, FIN]
  admitted_term: {year: 2, season: spring}     # sophomore spring
  extra_programs: [STA-BS-DECISION]            # joint major that also needs business-school admission
  source: "team decision 2026-11-05 (advisor knowledge; the Bulletin's admission page isn't scraped)"

not_double_majors:
  # Major pairs the Bulletin says can't be combined. Copied by hand from the
  # department pages' "Policies for the Majors and Minors" (2026-27).
  - {a: [BIO-BA, BIO-BS], b: [BMB-BS, ENV-BA, NEU-BA, NEU-BS], source: "Biology department page"}
  - {a: [ENV-BA], b: [BMB-BS, CHM-BS-BIOCHEMISTRY], source: "Environmental Program page"}
  - {a: [NEU-BA, NEU-BS], b: [PSY-BA], source: "Neuroscience department page"}
  - {a: [BMB-BS], b: [CHM-BA, CHM-BS, CHM-BS-BIOCHEMISTRY, CHM-BS-MATERIALS, CHM-BS-MEDICINAL], source: "Biochemistry and Molecular Biology page"}
  - {a: [STA-BS-DECISION, STA-BA, STA-BS, STA-BS-APPLIED], b: [STA-BS-DECISION, STA-BA, STA-BS, STA-BS-APPLIED], source: "Statistical Sciences department page"}

study_abroad:
  # A study-abroad semester is planned with "abroad course" slots instead of
  # catalog courses. Bulletin rules used (2026-27):
  #   - affiliate (non-Wake Forest) programs are transfer credit: at most 30 hours
  #     from outside Wake Forest count toward graduation, and no 21CS requirement
  #     may be met with transfer credit (Requirements for Degrees)
  #   - the senior year must be in Wake Forest programs (Requirements for Degrees)
  #   - department limits below, copied from the department pages
  min_hours: 12                 # ASSUMPTION (team 2026-11-05): a full-time abroad semester
  default_program_hours: 6      # ASSUMPTION (team 2026-11-05): College programs that state no limit
  business_program_hours: 6     # team decision 2026-11-05: business majors may count 6 hours from abroad
  subject_hours:                # limits stated on department pages
    SOC: {hours: 6, source: "Sociology: study abroad and transfer credit limited to two courses (6h)"}
    ENT: {hours: 6, source: "Entrepreneurship minor: no more than six hours can be taken abroad"}
    SPA: {hours: 3, affiliate_only: true, source: "Spanish: no more than 3 hours from non-Wake Forest programs"}
  categories: [BASIC-LANG, DIV-I, DIV-II, DIV-III, DIV-IV, DIV-V, 21CS-POR, 21CS-SWC, 21CS-EI, 21CS-QDA]
  notes:
    - "Abroad courses must be approved by the department before you go to count toward a major or minor."
    - "History courses from abroad count for a divisional only if designated (D); Sociology courses from abroad never do."
  source: "team decision 2026-11-05"
