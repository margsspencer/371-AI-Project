# AP exam credit, from Wake Forest's "Advanced Placement Policy 2025-26" (updated June 12, 2025):
# https://prod.wp.cdn.aws.wfu.edu/sites/120/2025/06/Advanced-Placement-Policy-2025-26.pdf
#
# Each exam lists score bands. A band gives course credit (hours as in the policy; 0 hours means
# the course counts as done for prerequisites and requirements but adds no hours) and, for
# languages, where the student starts in the language sequence (`language: {SUBJ: start course}`,
# or `done`). Courses missing from the 2026-27 catalog (SPA 154, SPA 212: old numbers) become
# outside credit with the same hours.
#
# Policy: "Students entering in or after Fall 2007 cannot use Advanced Placement courses to
# satisfy WFU divisional requirements; however, AP credit will count towards the 120 hours."
source: "WFU Advanced Placement Policy 2025-26 (June 12, 2025)"

