# Both Economics exams, combined score 8-10: ECN 150.
combined:
  - {exams: ["Economics: Microeconomics", "Economics: Macroeconomics"], min_total: 8, credit: [[ECN 150, 3]]}

# "Students who have received credit for 2 AP courses may elect to fulfill their college divisional
# with any 200 or 300 level course (excluding 390-392, 395, 398, 399)." Team reading (confirm with
# an advisor): with AP credit for two courses in a department, any 200/300-level course in that
# department counts toward its division.
divisional_after_two:
  min_courses: 2
  levels: [200, 399]
  excluded_numbers: ["390", "391", "392", "395", "398", "399"]
